spring.application.name=auth
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

server.error.include-message=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Publicacion asincrona de eventos de registro hacia el microservicio notification.
notifications.enabled=${NOTIFICATIONS_ENABLED:false}
aws.region=${AWS_REGION:us-east-1}
aws.endpoint=${AWS_ENDPOINT:}
aws.sqs.notification-queue-url=${AWS_SQS_NOTIFICATION_QUEUE_URL:}
