spring.application.name=notification
spring.main.web-application-type=none

notifications.enabled=${NOTIFICATIONS_ENABLED:false}
notification.poll-delay-ms=${NOTIFICATION_POLL_DELAY_MS:1000}
notification.phone-country-code=${NOTIFICATION_PHONE_COUNTRY_CODE:+57}

aws.region=${AWS_REGION:us-east-1}
aws.endpoint=${AWS_ENDPOINT:}
aws.sqs.notification-queue-url=${AWS_SQS_NOTIFICATION_QUEUE_URL:}
aws.ses.from-email=${AWS_SES_FROM_EMAIL:}
